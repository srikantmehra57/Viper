<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- Viper app screens redrawn in the website's theme. Rendered to PNG by render.sh.
     Text, numbers and layout follow the real Viper 1.0 screens. -->
<style>
  @font-face { font-family: 'General Sans'; src: url('../../src/fonts/GeneralSans-Medium.woff2') format('woff2'); font-weight: 500; }
  @font-face { font-family: 'General Sans'; src: url('../../src/fonts/GeneralSans-Semibold.woff2') format('woff2'); font-weight: 600; }
  @font-face { font-family: Gambetta; src: url('../../src/fonts/Gambetta-Regular.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Geist Mono'; src: url('../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  :root {
    --page: #2d2d2f; --card: #1f1f21; --raise: #28282a; --paper: #ebe6da; --ink: #efebe3; --ink-dark: #1d1d1f;
    --muted: #8e8b85; --dim: #6a6761; --line: rgba(239, 235, 227, 0.1); --line-2: rgba(239, 235, 227, 0.18); --orange: #ec7b4c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1133px; height: 768px; background: transparent; }
  body { font-family: 'General Sans', sans-serif; font-weight: 500; color: var(--ink); -webkit-font-smoothing: antialiased; font-size: 13px; letter-spacing: -0.005em; }
  svg { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .mono { font-family: 'Geist Mono', monospace; }
  h1, h2, h3, .brand b, .stat dd, .row b { font-weight: 600 !important; letter-spacing: -0.02em !important; }
  .row b small { font-weight: 500; letter-spacing: 0; }
  .sub, .tile p, .empty p, .info, .row p, .stat small { font-family: Gambetta, Georgia, serif; font-weight: 400; font-size: 1.08em; }

  .window { width: 1133px; height: 768px; display: flex; border-radius: 12px; overflow: hidden; background: var(--page); box-shadow: inset 0 0 0 1px var(--line-2); }
  .side { width: 217px; flex: none; background: var(--card); border-right: 1px solid var(--line); padding: 14px 12px 16px; display: flex; flex-direction: column; }
  .lights { display: flex; gap: 8px; padding: 0 2px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; background: #3c3c3f; }
  .brand { display: flex; align-items: center; gap: 10px; margin: 26px 6px 28px; }
  .brand img { width: 34px; height: 34px; border-radius: 9px; }
  .brand b { display: block; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
  .brand span { font-size: 11.5px; color: var(--muted); }
  .nav a { display: flex; align-items: center; gap: 11px; height: 33px; padding: 0 11px; margin-bottom: 2px; border-radius: 9px; font-size: 13.5px; color: #c8c4bb; }
  .nav a svg { width: 16px; height: 16px; color: var(--muted); }
  .nav a.on { background: var(--paper); color: var(--ink-dark); font-weight: 500; }
  .nav a.on svg { color: var(--ink-dark); }
  .nav a.on::after { content: ''; margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--orange); }
  .nav hr { border: 0; border-top: 1px solid var(--line); margin: 14px 10px; }
  .version { margin-top: auto; padding: 0 6px; font-size: 10.5px; color: var(--dim); }

  .main { flex: 1; padding: 42px 32px 0; overflow: hidden; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; }
  h1 { font-size: 29px; font-weight: 500; letter-spacing: -0.035em; line-height: 1.1; }
  .sub { margin-top: 7px; color: var(--muted); font-size: 13px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 15px; border-radius: 9px; font-size: 13.5px; font-weight: 600; }
  .btn svg { width: 14px; height: 14px; }
  .btn-paper { background: var(--paper); color: var(--ink-dark); }
  .btn-line { box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink); }

  .panel { position: relative; background: var(--card); border-radius: 14px; }
  .marks::before, .marks::after, .marks > .m1, .marks > .m2 { content: ''; position: absolute; width: 10px; height: 10px; border: 0 solid rgba(239, 235, 227, 0.6); }
  .marks::before { top: 12px; left: 12px; border-top-width: 1.5px; border-left-width: 1.5px; }
  .marks::after { top: 12px; right: 12px; border-top-width: 1.5px; border-right-width: 1.5px; }
  .marks > .m1 { bottom: 12px; left: 12px; border-bottom-width: 1.5px; border-left-width: 1.5px; }
  .marks > .m2 { bottom: 12px; right: 12px; border-bottom-width: 1.5px; border-right-width: 1.5px; }
  .idx { font-family: 'Geist Mono', monospace; font-size: 10.5px; color: var(--muted); }

  /* Overview */
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr auto; align-items: center; margin-top: 26px; padding: 26px 30px; }
  .stat dt { font-size: 12px; color: var(--muted); }
  .stat dd { margin-top: 6px; font-size: 25px; font-weight: 500; letter-spacing: -0.035em; }
  .stat small { display: block; margin-top: 5px; font-size: 11px; color: var(--dim); }
  .ring { display: flex; align-items: center; gap: 12px; font-size: 13px; color: #c8c4bb; }
  .section { display: flex; align-items: baseline; gap: 10px; margin: 30px 0 14px; }
  .section h2 { font-size: 19px; font-weight: 500; letter-spacing: -0.025em; }
  .section span { color: var(--muted); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { height: 168px; padding: 20px 22px; display: flex; flex-direction: column; }
  .tile.paper { background: var(--paper); color: var(--ink-dark); }
  .tile.paper .idx, .tile.paper p { color: #5f5b54; }
  .tile.paper .ico { box-shadow: inset 0 0 0 1px rgba(29, 29, 31, 0.25); color: var(--ink-dark); }
  .tile-top { display: flex; justify-content: space-between; }
  .ico { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink); }
  .ico svg { width: 18px; height: 18px; }
  .tile h3 { margin-top: auto; font-size: 15.5px; font-weight: 500; letter-spacing: -0.02em; display: flex; justify-content: space-between; }
  .tile h3 svg { width: 13px; height: 13px; color: var(--muted); }
  .tile p { margin-top: 6px; font-size: 12.5px; color: var(--muted); line-height: 1.45; max-width: 44ch; }

  /* Empty states */
  .seg { display: inline-flex; gap: 2px; margin-top: 24px; padding: 3px; border-radius: 11px; background: var(--card); }
  .seg span { height: 30px; padding: 0 16px; display: grid; place-items: center; border-radius: 8px; font-size: 13px; color: var(--muted); }
  .seg span.on { background: var(--paper); color: var(--ink-dark); font-weight: 500; }
  .info { display: flex; align-items: center; gap: 9px; margin-top: 20px; font-size: 12.5px; color: var(--muted); }
  .info svg { width: 14px; height: 14px; flex: none; }
  .empty { margin-top: 18px; height: 250px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .empty svg.art { width: 190px; height: 110px; stroke-width: 1.3; color: #dcd5c8; }
  .empty h2 { margin-top: 14px; font-size: 18px; font-weight: 500; letter-spacing: -0.02em; }
  .empty p { margin-top: 7px; color: var(--muted); }
  .updates { margin-top: 26px; padding: 24px 24px 22px; }
  .updates-head { display: flex; justify-content: space-between; align-items: baseline; }
  .updates-head h2 { font-size: 17px; font-weight: 500; letter-spacing: -0.02em; }
  .updates-head a { font-size: 12.5px; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
  .updates .empty { margin-top: 0; height: 250px; }

  /* Discover */
  .bar { display: flex; gap: 10px; align-items: center; }
  .search { flex: 1; height: 38px; border-radius: 10px; background: var(--card); display: flex; align-items: center; gap: 10px; padding: 0 14px; color: var(--dim); font-size: 13.5px; }
  .search svg { width: 15px; height: 15px; color: var(--muted); }
  .select { height: 38px; width: 140px; border-radius: 10px; background: var(--card); display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 13px; }
  .select svg { width: 12px; height: 12px; color: var(--muted); }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 0 6px; }
  .check i { width: 16px; height: 16px; border-radius: 5px; box-shadow: inset 0 0 0 1px var(--line-2); }
  .views { display: flex; padding: 3px; border-radius: 10px; background: var(--card); }
  .views span { width: 34px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
  .views span.on { background: var(--paper); color: var(--ink-dark); }
  .views svg { width: 14px; height: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; max-width: 790px; }
  .chips span { height: 30px; padding: 0 13px; display: grid; place-items: center; border-radius: 99px; font-size: 12.5px; color: #c8c4bb; box-shadow: inset 0 0 0 1px var(--line); }
  .chips span.on { background: var(--paper); color: var(--ink-dark); box-shadow: none; font-weight: 500; }
  .count { margin: 22px 0 10px; font-size: 10.5px; letter-spacing: 0.08em; color: var(--muted); }
  .list { padding: 6px 0; }
  .row { display: grid; grid-template-columns: 40px 1fr 170px 150px 80px; align-items: center; gap: 14px; height: 61px; padding: 0 18px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row img { width: 38px; height: 38px; border-radius: 9px; }
  .row b { font-size: 14px; font-weight: 500; letter-spacing: -0.015em; }
  .row b small { margin-left: 6px; font-size: 12px; font-weight: 400; color: var(--muted); }
  .row p { margin-top: 2px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tags { display: flex; gap: 6px; }
  .tags span { height: 22px; padding: 0 8px; display: grid; place-items: center; border-radius: 6px; font-size: 11px; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
  .state { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #c8c4bb; }
  .state svg { width: 13px; height: 13px; }
  .state.installed { color: var(--orange); }
  .add { justify-self: end; height: 30px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; border-radius: 8px; font-size: 12.5px; font-weight: 500; box-shadow: inset 0 0 0 1px var(--line-2); }
  .add svg { width: 12px; height: 12px; }
</style>
</head>
<body>
<div class="window">
  <aside class="side">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="brand"><img src="../../public/assets/viper-mark.svg" alt="" /><div><b>Viper</b><span>Mac care</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="version mono">Version 1.0.0</div>
  </aside>
  <main class="main" id="main"></main>
</div>
<script>
const I = {
  overview: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
  storage: '<rect x="3" y="6" width="18" height="12" rx="3"/><path d="M3 13h18M7 15.8h2"/>',
  uninstall: '<rect x="4" y="5" width="15" height="15" rx="4"/><circle cx="19" cy="5" r="2.2"/>',
  junk: '<path d="M4 13 6.5 5h11L20 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 13h4.5l1 2h5l1-2H20"/>',
  updates: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v8M8.5 12.5 12 16l3.5-3.5"/>',
  privacy: '<path d="M8 11V6.5a1.5 1.5 0 0 1 3 0V11m0-1V5a1.5 1.5 0 0 1 3 0v5m0 0V6.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-.5a6 6 0 0 1-5-2.7L3.8 14a1.5 1.5 0 0 1 2.5-1.7L8 14"/>',
  discover: '<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8.5v7M8.5 12h7"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>',
  arrow: '<path d="M7 17 17 7M8.5 7H17v8.5"/>',
  scan: '<path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/>',
  shield: '<path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6z"/>',
  refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>',
  chevron: '<path d="m6 9 6 6 6-6"/>',
  grid: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
  listv: '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
  seal: '<path d="M12 3l2.2 1.6 2.7-.1.8 2.6 2.2 1.6-.9 2.6.9 2.6-2.2 1.6-.8 2.6-2.7-.1L12 21l-2.2-1.6-2.7.1-.8-2.6-2.2-1.6.9-2.6-.9-2.6 2.2-1.6.8-2.6 2.7.1z"/><path d="m9 12 2 2 4-4"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  open: '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M10 14 14 10M11 10h3v3"/>',
  app: '<rect x="4" y="5" width="16" height="13" rx="2"/>',
  term: '<rect x="4" y="5" width="16" height="14" rx="2"/><path d="m8 10 2 2-2 2M12 14h4"/>',
};
const svg = (k, cls = '') => `<svg viewBox="0 0 24 24" class="${cls}">${I[k]}</svg>`;
const screen = new URLSearchParams(location.search).get('s') || 'overview';
const pages = [['overview', 'Overview'], ['storage', 'Storage'], ['uninstall', 'Uninstaller'], ['junk', 'Junk & Leftovers'], ['updates', 'Updates'], ['privacy', 'Privacy'], ['discover', 'Discover & Install']];
document.getElementById('nav').innerHTML = pages.map(([k, t]) => `<a class="${k === screen ? 'on' : ''}">${svg(k)}${t}</a>`).join('') + `<hr /><a>${svg('settings')}Settings</a>`;

// Isometric line drawings, same language as the website illustrations.
const tray = `<svg class="art" viewBox="0 0 190 110">
  <path d="M30 62 95 94l65-32-65-32z"/><path d="M30 62v10l65 32 65-32V62"/><path d="M95 94v10"/>
  <path d="M40 62 95 88l55-26" opacity=".45"/>
  <g transform="translate(58 38)"><path d="M0 10 14 17l14-7L14 3z"/><path d="M0 10v13l14 7 14-7V10"/><path d="M14 17v13"/></g>
  <g transform="translate(104 12)" style="stroke:#a8522e"><path d="M0 10 14 17l14-7L14 3z" fill="#f08a5d"/><path d="M0 10v13l14 7V17z" fill="#ec7b4c"/><path d="M28 10v13l-14 7V17z" fill="#c9653c"/></g>
  <g fill="#dcd5c8" stroke="none" opacity=".4"><circle cx="20" cy="20" r="1"/><circle cx="170" cy="30" r="1"/><circle cx="150" cy="8" r="1"/><circle cx="36" cy="40" r="1"/></g>
</svg>`;
const dial = `<svg class="art" viewBox="0 0 190 110">
  <ellipse cx="95" cy="82" rx="70" ry="22"/><path d="M25 82v4c0 12 31 22 70 22s70-10 70-22v-4"/>
  <ellipse cx="95" cy="82" rx="46" ry="14" stroke-dasharray="1 4" opacity=".6"/>
  <path d="M95 82 130 71A46 14 0 0 1 139 86z" fill="#ec7b4c" fill-opacity=".28" stroke="none"/>
  ${Array.from({ length: 24 }, (_, i) => { const a = i / 24 * Math.PI * 2, c = Math.cos(a), s = Math.sin(a); return `<path d="M${95 + c * 60} ${82 + s * 19}L${95 + c * 67} ${82 + s * 21}"/>`; }).join('')}
  <path d="M86 80V26M104 80V26"/><ellipse cx="95" cy="80" rx="9" ry="3"/>
  <path d="M84 26 95 6l11 20"/><ellipse cx="95" cy="26" rx="11" ry="3.4"/>
  <path d="M86 50v9c0 1.7 4 3 9 3s9-1.3 9-3v-9" fill="#ec7b4c" stroke="#a8522e"/><ellipse cx="95" cy="50" rx="9" ry="3" fill="#f08a5d" stroke="#a8522e"/>
</svg>`;

const views = {
  overview: `
    <h1>Overview</h1>
    <dl class="panel stats marks"><i class="m1"></i><i class="m2"></i>
      <div class="stat"><dt>Available</dt><dd>116.37 GB</dd><small>Includes 4.52 GB purgeable</small></div>
      <div class="stat"><dt>Used</dt><dd>128.73 GB</dd><small>Includes macOS and apps</small></div>
      <div class="stat"><dt>Volume</dt><dd>Macintosh HD</dd><small>245.11 GB total</small></div>
      <div class="ring"><svg viewBox="0 0 64 64" width="60" height="60" style="stroke-linecap:butt"><circle cx="32" cy="32" r="25" stroke="rgba(239,235,227,.16)" stroke-width="6"/><circle cx="32" cy="32" r="25" stroke="#ec7b4c" stroke-width="6" stroke-dasharray="${0.53 * 157.1} 157.1" transform="rotate(-90 32 32)"/></svg>53% used</div>
    </dl>
    <div class="section"><h2>Tools</h2><span>Everything is reviewed before it changes.</span></div>
    <div class="tiles">
      ${[['uninstall', 'Remove apps carefully', 'Review evidence-backed app, settings, cache, and package matches before removal.'],
        ['junk', 'Clean junk and leftovers', 'Clear caches, logs, temporary files, and files from removed apps.'],
        ['discover', 'Set up your apps', 'Pick popular apps and install them together, with a clear review first.'],
        ['updates', 'Stay up to date', 'See available app and tool updates, then choose what to update.'],
        ['privacy', 'Your privacy, clearly', 'Open the right permission setting, or reset an app’s permissions.'],
        ['storage', 'Make space', 'Find the biggest files in a folder and move them to the Trash.']]
        .map(([k, t, d], i) => `<div class="panel tile ${i === 1 ? 'paper' : ''}"><div class="tile-top"><span class="ico">${svg(k)}</span><span class="idx">00${i + 1}</span></div><h3>${t}${svg('arrow')}</h3><p>${d}</p></div>`).join('')}
    </div>`,
  junk: `
    <div class="head"><div><h1>Junk &amp; Leftovers</h1><p class="sub">Caches, logs, old temporary files, and build data.</p></div><span class="btn btn-paper">${svg('scan')}Scan</span></div>
    <div class="seg"><span class="on">Junk files</span><span>App leftovers</span></div>
    <p class="info">${svg('shield')}Items belonging to apps that are open right now are kept. Safe-to-rebuild items are selected; slower-to-rebuild items are listed for you to choose.</p>
    <div class="panel empty marks"><i class="m1"></i><i class="m2"></i>${tray}<h2>Ready when you are.</h2><p>Scan to see what can be cleaned. Nothing moves until you confirm.</p></div>`,
  updates: `
    <div class="head"><div><h1>Updates</h1><p class="sub">Check for updates when you’re ready. Nothing updates automatically.</p></div><span class="btn btn-line">${svg('refresh')}Check for updates</span></div>
    <div class="panel updates marks"><i class="m1"></i><i class="m2"></i>
      <div class="updates-head"><h2>Available updates</h2><a>Manage sources</a></div>
      <div class="empty">${dial}<h2>Let’s see what’s new.</h2><p>Your available updates will appear here after a check.</p></div>
      <p class="info" style="margin-top:0">${svg('info')}Homebrew and npm updates run with their own package manager. Homebrew may update dependencies too. Updates can’t be rolled back.</p>
    </div>`,
  discover: `
    <div class="bar" style="margin-top:-10px">
      <div class="search">${svg('search')}Search apps, publishers, or tools</div>
      <div class="select">All apps${svg('chevron')}</div>
      <div class="check"><i></i>Compatible only</div>
      <div class="views"><span>${svg('grid')}</span><span class="on">${svg('listv')}</span></div>
    </div>
    <div class="chips">${['All categories', 'IDEs & Developer Tools', 'AI Agents & Assistants', 'Music & Audio', 'Video', 'Gaming', 'Browsers', 'Images & Design', 'Utilities', 'Productivity', 'Communication'].map((c, i) => `<span class="${i ? '' : 'on'}">${c.replace('&', '&amp;')}</span>`).join('')}</div>
    <p class="count mono">134 APPS</p>
    <div class="panel list">
      ${[['visual-studio-code', 'Visual Studio Code', 'Microsoft', 'A popular, extensible code editor for almost any language.'],
        ['zed', 'Zed', 'Zed Industries', 'A fast, modern code editor with built-in collaboration.'],
        ['iterm2', 'iTerm2', 'George Nachman', 'A feature-rich alternative to the built-in Terminal.'],
        ['jetbrains-toolbox', 'JetBrains Toolbox', 'JetBrains', 'Installs and updates JetBrains IDEs such as IntelliJ IDEA.'],
        ['sublime-text', 'Sublime Text', 'Sublime HQ', 'A lightweight, fast editor for code and prose.'],
        ['postman', 'Postman', 'Postman', 'Build, test, and document APIs.'],
        ['docker-desktop', 'Docker Desktop', 'Docker', 'Run containers and local development environments.'],
        ['xcode', 'Xcode', 'Apple', 'Apple’s tools for building apps for Mac, iPhone and iPad.', true],
        ['git', 'Git', 'The Git project', 'Track changes in code and other files.', false, true],
        ['gh', 'GitHub CLI', 'GitHub', 'Work with GitHub from the command line.', false, true]]
        .map(([id, n, p, d, inst, cli]) => `<div class="row"><img src="../../../Resources/CatalogIcons/${id}.png" alt="" /><div><b>${n}<small>${p}</small></b><p>${d}</p></div>
          <div class="tags"><span>${cli ? 'Command line' : 'App'}</span><span>${inst ? 'App Store' : 'Homebrew'}</span></div>
          <span class="state ${inst ? 'installed' : ''}">${svg('seal')}${inst ? 'Installed · 27.0' : 'Ready to install'}</span>
          <span class="add">${inst ? svg('open') + 'Open' : svg('plus') + 'Add'}</span></div>`).join('')}
    </div>`,
};
document.getElementById('main').innerHTML = views[screen];
</script>
</body>
</html>
